name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'github-actions/docker-cicd-project/**'
      - '.github/workflows/docker-deploy.yml'

jobs:
  test-build-push-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: github-actions/docker-cicd-project

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Run pylint
      - name: Run pylint
        run: |
          pylint app.py

      # Run tests
      - name: Run tests
        run: |
          pytest

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:v2 .

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:v2

      # Deploy application to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest Docker image
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:v2

            # Stop existing container if running
            sudo docker stop flask-app || true

            # Remove existing container if present
            sudo docker rm flask-app || true

            # Run new container
            sudo docker run -d \
              --name flask-app \
              -p 5001:5000 \
              ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:v2
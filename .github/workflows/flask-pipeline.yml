name: Python App CI/CD

on:
  workflow_dispatch:
  
jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: github-actions/flask-app

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt

      # Step 4: Run pylint
      - name: Run pylint
        run: |
          pylint app.py

      # Step 5: Run tests
      - name: Run tests
        run: |
          pytest

  deploy:
    needs: test
    runs-on: self-hosted

    defaults:
      run:
        working-directory: github-actions/flask-app

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install dependencies on self-hosted runner
      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt --break-system-packages

      # Step 3: Restart Flask application service
      - name: Restart Flask service
        run: |
         echo "Restarting Flask application..."

         sudo systemctl daemon-reload

         sudo systemctl restart flask-app

         sleep 5

         echo "Service state:"
         sudo systemctl is-active flask-app

         echo "Checking Flask process:"
         ps aux | grep app.py

         echo "Checking port 5000:"
         ss -tulnp | grep 5000 || true

         echo "Deployment completed successfully!"